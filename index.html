<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>AI or Not</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg-elevated: #14141c;
  --fg: #e8e8f0;
  --fg-muted: #6a6a7a;
  --accent: #00ff88;
  --accent-dim: #00cc6a;
  --danger: #ff3860;
  --success: #00ff88;
  --gold: #ffd23f;
  --border: #2a2a3a;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --transition: 200ms;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-weight: 400;
  overscroll-behavior: none;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: 32px 48px;
  opacity: 0;
  transition: opacity var(--transition) ease;
}

.screen.active {
  display: flex;
  opacity: 1;
}

/* ================= WELCOME ================= */
#welcome {
  align-items: center;
  justify-content: center;
  gap: 28px;
}

.logo {
  font-size: 96px;
  font-weight: 800;
  letter-spacing: -2px;
  color: var(--accent);
  text-shadow: 0 0 24px rgba(0, 255, 136, 0.35);
  line-height: 1;
}

.logo .or {
  color: var(--fg);
  font-weight: 400;
  opacity: 0.55;
  font-size: 64px;
}

.tagline {
  font-size: 14px;
  color: var(--fg-muted);
  letter-spacing: 6px;
  text-transform: uppercase;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 24px 72px;
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 6px;
  cursor: pointer;
  min-height: 80px;
  border-radius: 4px;
  transition: transform var(--transition), box-shadow var(--transition);
}

.btn-primary:active {
  transform: scale(0.97);
  box-shadow: 0 0 32px rgba(0, 255, 136, 0.55);
}

.leaderboard-mini {
  margin-top: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px 32px;
  min-width: 340px;
}

.leaderboard-mini h3 {
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 6px;
  text-align: center;
  margin-bottom: 14px;
  text-transform: uppercase;
}

.leaderboard-mini .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
  padding: 5px 0;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.leaderboard-mini .rank { color: var(--accent); width: 32px; }
.leaderboard-mini .name { flex: 1; letter-spacing: 6px; color: var(--fg); }
.leaderboard-mini .score { color: var(--fg); }

/* ================= GAME ================= */
#game {
  padding: 24px 32px;
  gap: 16px;
}

.hud {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  width: 100%;
}

.timer {
  font-size: 64px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  transition: color 150ms;
}

.timer.low {
  color: var(--danger);
  animation: pulse 800ms ease-in-out infinite;
}

.timer .unit {
  font-size: 18px;
  color: var(--fg-muted);
  letter-spacing: 4px;
  margin-left: 8px;
  text-transform: uppercase;
  font-weight: 700;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.score-display { text-align: right; }
.score-display .label {
  color: var(--fg-muted);
  font-size: 12px;
  letter-spacing: 6px;
  display: block;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.score-display .value {
  font-size: 36px;
  font-weight: 700;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.image-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
}

.image-stage img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: opacity 150ms ease;
}

.image-stage.shake {
  animation: shake 320ms cubic-bezier(.36,.07,.19,.97);
}

@keyframes shake {
  10%, 90% { transform: translateX(-4px); }
  20%, 80% { transform: translateX(6px); }
  30%, 50%, 70% { transform: translateX(-8px); }
  40%, 60% { transform: translateX(8px); }
}

/* combo badge — sağ üst */
.combo-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--accent);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -1px;
  padding: 6px 18px;
  border-radius: 6px;
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 200ms, transform 200ms;
  pointer-events: none;
  box-shadow: 0 0 28px rgba(0, 255, 136, 0.55);
  z-index: 3;
}
.combo-badge.shown { opacity: 1; transform: scale(1); }
.combo-badge.bump  { animation: comboBump 480ms cubic-bezier(.22,1,.36,1); }
@keyframes comboBump {
  0%   { transform: scale(1) rotate(0); }
  25%  { transform: scale(1.5) rotate(-6deg); }
  60%  { transform: scale(1.05) rotate(2deg); }
  100% { transform: scale(1) rotate(0); }
}

/* skip butonu — sol üst */
.skip-btn {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(20, 20, 28, 0.78);
  color: var(--fg);
  border: 2px solid var(--border);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 4px;
  padding: 10px 18px;
  border-radius: 4px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform var(--transition), border-color var(--transition), color var(--transition), opacity var(--transition);
  z-index: 3;
}
.skip-btn .count {
  display: inline-block;
  margin-left: 8px;
  background: var(--accent);
  color: var(--bg);
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 13px;
}
.skip-btn:active { transform: scale(0.95); border-color: var(--accent); color: var(--accent); }
.skip-btn:disabled { opacity: 0.3; cursor: default; }

.flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 2;
}
.flash.flash-correct { animation: flashGreen 420ms ease-out; }
.flash.flash-wrong   { animation: flashRed   420ms ease-out; }

@keyframes flashGreen {
  0%   { opacity: 0;    background: var(--success); }
  20%  { opacity: 0.42; background: var(--success); }
  100% { opacity: 0;    background: var(--success); }
}
@keyframes flashRed {
  0%   { opacity: 0;   background: var(--danger); }
  20%  { opacity: 0.5; background: var(--danger); }
  100% { opacity: 0;   background: var(--danger); }
}

.score-pop {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 112px;
  font-weight: 800;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  text-shadow: 0 0 24px currentColor, 0 2px 16px rgba(0,0,0,0.5);
  animation: scorePop 820ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  z-index: 4;
}
.score-pop.pop-good { color: var(--success); }
.score-pop.pop-bad  { color: var(--danger); }
.score-pop.pop-combo { color: var(--gold); text-shadow: 0 0 32px var(--gold), 0 2px 16px rgba(0,0,0,0.5); }

@keyframes scorePop {
  0%   { transform: translate(-50%, -40%)  scale(0.5); opacity: 0; }
  15%  { transform: translate(-50%, -50%)  scale(1.18); opacity: 1; }
  35%  { transform: translate(-50%, -55%)  scale(1.0);  opacity: 1; }
  100% { transform: translate(-50%, -120%) scale(0.95); opacity: 0; }
}

/* tier-up streak banner */
.streak-banner {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 84px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: -2px;
  pointer-events: none;
  opacity: 0;
  text-shadow: 0 0 32px var(--gold), 0 0 64px rgba(255, 210, 63, 0.6);
  white-space: nowrap;
  z-index: 5;
}
.streak-banner.fire { animation: streakBanner 1000ms cubic-bezier(.22,1,.36,1) forwards; }
@keyframes streakBanner {
  0%   { transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); opacity: 0; }
  20%  { transform: translate(-50%, -50%) scale(1.35) rotate(-6deg); opacity: 1; }
  45%  { transform: translate(-50%, -50%) scale(1.0)  rotate(-2deg); opacity: 1; }
  100% { transform: translate(-50%, -120%) scale(1.1) rotate(0);     opacity: 0; }
}

/* debug label — gerçek görseller hazır olunca DEBUG_LABEL=false yap */
.debug-label {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 210, 63, 0.16);
  color: var(--gold);
  border: 1px solid rgba(255, 210, 63, 0.45);
  padding: 8px 20px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 4px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 150ms;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 3;
  white-space: nowrap;
}
.debug-label.shown { opacity: 1; }

/* 3-2-1 countdown */
.countdown {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(10, 10, 15, 0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 10;
  font-family: var(--font-mono);
}
.countdown.shown { display: flex; }
.countdown .num {
  font-size: 240px;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 48px rgba(0, 255, 136, 0.7);
  font-variant-numeric: tabular-nums;
  animation: cdNum 720ms ease-out forwards;
}
@keyframes cdNum {
  0%   { transform: scale(0.4); opacity: 0; }
  20%  { transform: scale(1.2); opacity: 1; }
  60%  { transform: scale(1.0); opacity: 1; }
  100% { transform: scale(0.6); opacity: 0; }
}
.countdown .go {
  font-size: 140px;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 48px rgba(0, 255, 136, 0.8);
  animation: cdGo 720ms ease-out forwards;
}
@keyframes cdGo {
  0%   { transform: scale(0.4); opacity: 0; letter-spacing: 0; }
  20%  { transform: scale(1.2); opacity: 1; letter-spacing: 16px; }
  100% { transform: scale(1.8); opacity: 0; letter-spacing: 40px; }
}

.choice-row {
  display: flex;
  gap: 16px;
}

.btn-choice {
  flex: 1;
  min-height: 96px;
  background: var(--bg-elevated);
  color: var(--fg);
  border: 2px solid var(--border);
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 6px;
  cursor: pointer;
  border-radius: 4px;
  transition: transform var(--transition), border-color var(--transition), color var(--transition), opacity var(--transition);
}

.btn-choice:active {
  transform: scale(0.98);
  border-color: var(--accent);
  color: var(--accent);
}

.btn-choice:disabled {
  opacity: 0.4;
  cursor: default;
}

/* ================= END ================= */
#end {
  align-items: center;
  justify-content: center;
  gap: 18px;
}

.end-label {
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 6px;
  text-transform: uppercase;
}

.final-score {
  font-size: 144px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-shadow: 0 0 32px rgba(0, 255, 136, 0.35);
}

.name-input-row {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.name-input-row.shown { display: flex; }

.name-input {
  background: var(--bg-elevated);
  color: var(--accent);
  border: 2px solid var(--border);
  font-family: var(--font-mono);
  font-size: 56px;
  font-weight: 800;
  text-align: center;
  letter-spacing: 16px;
  width: 240px;
  padding: 16px 16px 16px 32px;
  text-transform: uppercase;
  border-radius: 4px;
  outline: none;
  caret-color: var(--accent);
}

.name-input:focus { border-color: var(--accent); }

.btn-secondary {
  background: transparent;
  color: var(--fg);
  border: 2px solid var(--border);
  padding: 24px 64px;
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 4px;
  cursor: pointer;
  min-height: 80px;
  border-radius: 4px;
  transition: transform var(--transition), border-color var(--transition), color var(--transition);
}

.btn-secondary:active {
  transform: scale(0.97);
  border-color: var(--accent);
  color: var(--accent);
}
</style>
</head>
<body>

<div id="app">

  <!-- ============ WELCOME ============ -->
  <section id="welcome" class="screen active">
    <div class="logo">AI <span class="or">or</span> NOT</div>
    <div class="tagline">YAPAY ZEKA mı &nbsp;·&nbsp; GERÇEK mi</div>
    <button class="btn-primary" id="btn-start">BAŞLA</button>
    <div class="leaderboard-mini">
      <h3>TOP 5</h3>
      <div id="leaderboard-list"></div>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game" class="screen">
    <div class="hud">
      <div class="timer" id="timer-box"><span id="timer">60</span><span class="unit">sn</span></div>
      <div class="score-display">
        <span class="label">SKOR</span>
        <span class="value" id="score">0</span>
      </div>
    </div>
    <div class="image-stage" id="image-stage">
      <img id="image" alt="">
      <button class="skip-btn" id="skip-btn">SKIP<span class="count" id="skip-count">2</span></button>
      <div class="combo-badge" id="combo-badge"></div>
      <div class="streak-banner" id="streak-banner"></div>
      <div class="debug-label" id="debug-label"></div>
      <div class="flash" id="flash"></div>
      <div class="countdown" id="countdown"></div>
    </div>
    <div class="choice-row">
      <button class="btn-choice" data-choice="ai">YAPAY ZEKA</button>
      <button class="btn-choice" data-choice="real">GERÇEK</button>
    </div>
  </section>

  <!-- ============ END ============ -->
  <section id="end" class="screen">
    <div class="end-label">SÜRE BİTTİ</div>
    <div class="final-score" id="final-score">0</div>
    <div class="name-input-row" id="name-row">
      <div class="end-label">TOP 5'E GİRDİN · İSMİNİ GİR</div>
      <input class="name-input" id="name-input" maxlength="3" autocomplete="off" inputmode="text">
    </div>
    <button class="btn-secondary" id="btn-restart">TEKRAR OYNA</button>
  </section>

</div>

<script>
// =========================================================
// CONFIG
// =========================================================
const BIN_URL = '';
const API_KEY = '';
const DEBUG_LABEL = true;  // gerçek görseller hazır olunca false yap

const ROUND_DURATION_MS     = 60000;
const COUNTDOWN_STEP_MS     = 700;
const BASE_SCORE            = 50;
const SPEED_BONUS_MAX       = 100;
const SPEED_BONUS_WINDOW_MS = 1000;
const WRONG_SCORE_PENALTY   = -50;
const WRONG_TIME_PENALTY_MS = 3000;
const SKIP_LIMIT            = 2;
const COMBO_TIER_SIZE       = 5;
const COMBO_MAX_MULT        = 4;
const LEADERBOARD_SIZE      = 5;
const LB_STORAGE_KEY        = 'aiornot_leaderboard_v1';
const FEEDBACK_HOLD_MS      = 380;
const LOW_TIME_THRESHOLD_S  = 10;

const FALLBACK_IMAGES = [
  { file: 'https://picsum.photos/seed/ainot-ai-1/1000/700',   label: 'ai'   },
  { file: 'https://picsum.photos/seed/ainot-real-1/1000/700', label: 'real' },
  { file: 'https://picsum.photos/seed/ainot-ai-2/1000/700',   label: 'ai'   },
  { file: 'https://picsum.photos/seed/ainot-real-2/1000/700', label: 'real' },
  { file: 'https://picsum.photos/seed/ainot-ai-3/1000/700',   label: 'ai'   },
];

// =========================================================
// STATE
// =========================================================
const state = {
  screen:        'welcome',
  images:        [],
  deckIndex:     0,
  current:       null,
  questionStart: 0,
  score:         0,
  streak:        0,
  skipsLeft:     SKIP_LIMIT,
  timeLeftMs:    ROUND_DURATION_MS,
  prevSec:       Math.ceil(ROUND_DURATION_MS / 1000),
  rafId:         null,
  lastFrameTime: 0,
  busy:          false,
  pendingNextId: null,
  leaderboard:   [],
};

// =========================================================
// SOUND (WebAudio — dış dosya yok)
// =========================================================
const sfx = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol) {
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sweep(f1, f2, dur, type, vol) {
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f1, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  return {
    prime()    { ensure(); },
    click()    { tone(720, 0.05, 'square', 0.07); },
    correct()  { sweep(520, 920, 0.16, 'triangle', 0.18); },
    wrong()    { sweep(260, 90, 0.30, 'sawtooth', 0.18); },
    streak()   {
      sweep(660, 990,  0.10, 'square', 0.14);
      setTimeout(() => sweep(990, 1320, 0.10, 'square', 0.14), 70);
      setTimeout(() => sweep(1320, 1980, 0.16, 'square', 0.16), 140);
    },
    tick()     { tone(1100, 0.05, 'sine', 0.10); },
    countdown(){ tone(620, 0.08, 'triangle', 0.14); },
    go()       { sweep(440, 880, 0.22, 'triangle', 0.20); },
    end()      { sweep(440, 110, 0.55, 'sawtooth', 0.18); },
    skip()     { sweep(500, 700, 0.10, 'sine', 0.10); },
  };
})();

// =========================================================
// UTIL
// =========================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function resolveImageSrc(entry) {
  return /^https?:\/\//.test(entry.file) ? entry.file : `images/${entry.file}`;
}

function sanitizeName(raw) {
  return (raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// =========================================================
// IMAGES
// =========================================================
async function loadImages() {
  try {
    const res = await fetch('images.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) return data;
    throw new Error('empty');
  } catch (e) {
    console.warn('images.json okunamadı, fallback kullanılıyor:', e.message);
    return FALLBACK_IMAGES;
  }
}

function pickNext() {
  if (state.deckIndex >= state.images.length) {
    state.images = shuffle(state.images);
    state.deckIndex = 0;
  }
  state.current = state.images[state.deckIndex++];
  return state.current;
}

function preloadAll() {
  state.images.forEach(entry => {
    const im = new Image();
    im.src = resolveImageSrc(entry);
  });
}

// =========================================================
// SCREEN
// =========================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  state.screen = name;
}

// =========================================================
// COMBO
// =========================================================
function comboMultiplier() {
  if (state.streak < COMBO_TIER_SIZE) return 1;
  return Math.min(COMBO_MAX_MULT, Math.floor(state.streak / COMBO_TIER_SIZE) + 1);
}

function updateComboBadge(bump) {
  const badge = document.getElementById('combo-badge');
  const mult = comboMultiplier();
  if (mult > 1) {
    badge.textContent = '×' + mult;
    badge.classList.add('shown');
    if (bump) {
      badge.classList.remove('bump');
      void badge.offsetWidth;
      badge.classList.add('bump');
    }
  } else {
    badge.classList.remove('shown', 'bump');
  }
}

function updateDebugLabel() {
  const el = document.getElementById('debug-label');
  if (!DEBUG_LABEL || !state.current) {
    el.classList.remove('shown');
    return;
  }
  el.textContent = state.current.label === 'ai' ? 'YAPAY ZEKA GÖRSELİ' : 'GERÇEK GÖRSEL';
  el.classList.add('shown');
}

function hideDebugLabel() {
  document.getElementById('debug-label').classList.remove('shown');
}

function fireStreakBanner(mult) {
  const b = document.getElementById('streak-banner');
  b.textContent = 'STREAK ×' + mult;
  b.classList.remove('fire');
  void b.offsetWidth;
  b.classList.add('fire');
}

// =========================================================
// SKIP
// =========================================================
function updateSkipBtn() {
  const btn = document.getElementById('skip-btn');
  const cnt = document.getElementById('skip-count');
  cnt.textContent = state.skipsLeft;
  btn.disabled = state.skipsLeft <= 0 || state.busy || state.screen !== 'game' || state.timeLeftMs <= 0;
}

function handleSkip() {
  if (state.skipsLeft <= 0 || state.busy || state.screen !== 'game' || state.timeLeftMs <= 0) return;
  state.skipsLeft--;
  sfx.skip();
  state.busy = true;
  setChoicesDisabled(true);
  updateSkipBtn();

  // fade-out mevcut görseli kısaca, sonra sonraki
  const img = document.getElementById('image');
  img.style.opacity = '0.3';

  state.pendingNextId = setTimeout(() => {
    state.pendingNextId = null;
    state.busy = false;
    if (state.screen !== 'game' || state.timeLeftMs <= 0) return;
    setChoicesDisabled(false);
    updateSkipBtn();
    showNextQuestion();
  }, 180);
}

// =========================================================
// GAME LOOP
// =========================================================
async function startGame() {
  sfx.prime();
  sfx.click();

  if (state.rafId) cancelAnimationFrame(state.rafId);
  if (state.pendingNextId) clearTimeout(state.pendingNextId);
  state.rafId = null;
  state.pendingNextId = null;

  state.score       = 0;
  state.streak      = 0;
  state.skipsLeft   = SKIP_LIMIT;
  state.timeLeftMs  = ROUND_DURATION_MS;
  state.prevSec     = Math.ceil(ROUND_DURATION_MS / 1000);
  state.busy        = false;

  if (state.images.length === 0) {
    state.images = await loadImages();
  }
  state.images    = shuffle(state.images);
  state.deckIndex = 0;

  preloadAll();

  // ilk soruyu seç ve gizliyken yükle
  pickNext();
  const firstImg = new Image();
  firstImg.src = resolveImageSrc(state.current);

  const imgEl = document.getElementById('image');
  imgEl.style.opacity = '0';
  imgEl.removeAttribute('src');

  updateScore();
  updateTimer();
  updateComboBadge(false);
  setChoicesDisabled(true);
  updateSkipBtn();

  showScreen('game');

  await runCountdown();

  // ilk soruyu göster
  imgEl.src = firstImg.src;
  imgEl.style.opacity = '1';
  state.questionStart = performance.now();
  updateDebugLabel();
  setChoicesDisabled(false);
  updateSkipBtn();

  state.lastFrameTime = performance.now();
  state.rafId = requestAnimationFrame(tick);
}

async function runCountdown() {
  const cd = document.getElementById('countdown');
  cd.classList.add('shown');
  for (const step of ['3', '2', '1']) {
    cd.innerHTML = '<div class="num">' + step + '</div>';
    sfx.countdown();
    await sleep(COUNTDOWN_STEP_MS);
  }
  cd.innerHTML = '<div class="go">GO</div>';
  sfx.go();
  await sleep(COUNTDOWN_STEP_MS);
  cd.classList.remove('shown');
  cd.innerHTML = '';
}

function tick(now) {
  const dt = now - state.lastFrameTime;
  state.lastFrameTime = now;
  state.timeLeftMs -= dt;

  if (state.timeLeftMs <= 0) {
    state.timeLeftMs = 0;
    updateTimer();
    endGame();
    return;
  }

  const secs = Math.ceil(state.timeLeftMs / 1000);
  if (secs !== state.prevSec) {
    if (secs > 0 && secs <= 5) sfx.tick();
    state.prevSec = secs;
  }

  updateTimer();
  state.rafId = requestAnimationFrame(tick);
}

function updateTimer() {
  const secs = Math.ceil(state.timeLeftMs / 1000);
  document.getElementById('timer').textContent = secs;
  document.getElementById('timer-box').classList.toggle('low', secs > 0 && secs <= LOW_TIME_THRESHOLD_S);
}

function updateScore() {
  document.getElementById('score').textContent = state.score;
}

function showNextQuestion() {
  pickNext();
  const img = document.getElementById('image');
  img.style.opacity = '0';
  hideDebugLabel();

  const preload = new Image();
  const swap = () => {
    img.src = preload.src;
    img.style.opacity = '1';
    state.questionStart = performance.now();
    updateDebugLabel();
  };
  preload.onload  = swap;
  preload.onerror = swap;
  preload.src = resolveImageSrc(state.current);
}

function setChoicesDisabled(disabled) {
  document.querySelectorAll('.btn-choice').forEach(b => { b.disabled = disabled; });
}

function handleChoice(choice) {
  if (state.busy || state.screen !== 'game' || state.timeLeftMs <= 0) return;

  const correct = choice === state.current.label;
  const elapsed = performance.now() - state.questionStart;

  let delta, popClass;
  if (correct) {
    const bonus = Math.max(0, SPEED_BONUS_MAX - elapsed / (SPEED_BONUS_WINDOW_MS / SPEED_BONUS_MAX));
    const base = BASE_SCORE + bonus;
    const prevMult = comboMultiplier();
    state.streak++;
    const newMult = comboMultiplier();
    delta = Math.round(base * newMult);

    const tierUp = newMult > prevMult;
    updateComboBadge(tierUp || newMult > 1);

    if (tierUp && newMult > 1) {
      fireStreakBanner(newMult);
      sfx.streak();
    } else {
      sfx.correct();
    }
    popClass = newMult > 1 ? 'pop-combo' : 'pop-good';
  } else {
    delta = WRONG_SCORE_PENALTY;
    state.timeLeftMs = Math.max(0, state.timeLeftMs - WRONG_TIME_PENALTY_MS);
    state.prevSec = Math.ceil(state.timeLeftMs / 1000);
    state.streak = 0;
    updateComboBadge(false);
    updateTimer();
    sfx.wrong();

    const stage = document.getElementById('image-stage');
    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
    popClass = 'pop-bad';
  }

  state.score += delta;
  updateScore();
  flashFeedback(correct, delta, popClass);

  state.busy = true;
  setChoicesDisabled(true);
  updateSkipBtn();

  state.pendingNextId = setTimeout(() => {
    state.pendingNextId = null;
    state.busy = false;
    if (state.screen !== 'game' || state.timeLeftMs <= 0) return;
    setChoicesDisabled(false);
    updateSkipBtn();
    showNextQuestion();
  }, FEEDBACK_HOLD_MS);
}

function flashFeedback(correct, delta, popClass) {
  const flash = document.getElementById('flash');
  flash.classList.remove('flash-correct', 'flash-wrong');
  void flash.offsetWidth;
  flash.classList.add(correct ? 'flash-correct' : 'flash-wrong');

  const stage = document.getElementById('image-stage');
  const pop = document.createElement('div');
  pop.className = 'score-pop ' + popClass;
  pop.textContent = (delta >= 0 ? '+' : '') + delta;
  stage.appendChild(pop);
  setTimeout(() => pop.remove(), 850);
}

function endGame() {
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = null;
  if (state.pendingNextId) clearTimeout(state.pendingNextId);
  state.pendingNextId = null;
  state.busy = false;
  setChoicesDisabled(false);
  updateSkipBtn();

  sfx.end();

  document.getElementById('final-score').textContent = state.score;

  const nameRow = document.getElementById('name-row');
  if (leaderboardQualifies(state.score) && state.score > 0) {
    nameRow.classList.add('shown');
    const ni = document.getElementById('name-input');
    ni.value = '';
    setTimeout(() => ni.focus(), 350);
  } else {
    nameRow.classList.remove('shown');
  }
  showScreen('end');
}

// =========================================================
// LEADERBOARD
// =========================================================
function leaderboardQualifies(score) {
  if (state.leaderboard.length < LEADERBOARD_SIZE) return true;
  return score > state.leaderboard[state.leaderboard.length - 1].score;
}

async function loadLeaderboard() {
  if (BIN_URL && API_KEY) {
    try {
      const res = await fetch(BIN_URL + '/latest', {
        headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': 'false' }
      });
      if (res.ok) {
        const data = await res.json();
        const record = data && (data.record !== undefined ? data.record : data);
        const entries = Array.isArray(record) ? record : (Array.isArray(record?.entries) ? record.entries : null);
        if (Array.isArray(entries)) {
          state.leaderboard = sortAndCut(entries);
          try { localStorage.setItem(LB_STORAGE_KEY, JSON.stringify(state.leaderboard)); } catch (e) {}
          return;
        }
      }
    } catch (e) {
      console.warn('JSONBin okuma başarısız, localStorage\'a düşüyor:', e.message);
    }
  }
  try {
    const local = JSON.parse(localStorage.getItem(LB_STORAGE_KEY) || '[]');
    state.leaderboard = sortAndCut(Array.isArray(local) ? local : []);
  } catch (e) {
    state.leaderboard = [];
  }
}

async function saveLeaderboard() {
  try { localStorage.setItem(LB_STORAGE_KEY, JSON.stringify(state.leaderboard)); } catch (e) {}
  if (BIN_URL && API_KEY) {
    try {
      await fetch(BIN_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
        body: JSON.stringify({ entries: state.leaderboard })
      });
    } catch (e) { console.warn('JSONBin yazma başarısız:', e.message); }
  }
}

function sortAndCut(arr) {
  return arr
    .filter(e => e && typeof e.score === 'number' && typeof e.name === 'string')
    .sort((a, b) => b.score - a.score)
    .slice(0, LEADERBOARD_SIZE);
}

function renderLeaderboard() {
  const list = document.getElementById('leaderboard-list');
  const rows = [];
  for (let i = 0; i < LEADERBOARD_SIZE; i++) {
    const e = state.leaderboard[i];
    const name  = e ? e.name  : '---';
    const score = e ? e.score : 0;
    rows.push(
      '<div class="row">' +
        '<span class="rank">' + (i + 1) + '</span>' +
        '<span class="name">' + name + '</span>' +
        '<span class="score">' + score + '</span>' +
      '</div>'
    );
  }
  list.innerHTML = rows.join('');
}

async function submitScoreIfNeeded() {
  const nameRow = document.getElementById('name-row');
  if (!nameRow.classList.contains('shown')) return;

  const clean = sanitizeName(document.getElementById('name-input').value);
  const name = clean.length > 0 ? clean.padEnd(3, '-') : '---';
  state.leaderboard.push({ name, score: state.score });
  state.leaderboard = sortAndCut(state.leaderboard);
  await saveLeaderboard();
}

// =========================================================
// WIRING
// =========================================================
document.getElementById('btn-start').addEventListener('click', startGame);

document.querySelectorAll('.btn-choice').forEach(btn => {
  btn.addEventListener('click', () => handleChoice(btn.dataset.choice));
});

document.getElementById('skip-btn').addEventListener('click', handleSkip);

document.getElementById('btn-restart').addEventListener('click', async () => {
  sfx.click();
  await submitScoreIfNeeded();
  renderLeaderboard();
  showScreen('welcome');
});

document.getElementById('name-input').addEventListener('input', (e) => {
  e.target.value = sanitizeName(e.target.value);
});

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

document.addEventListener('visibilitychange', () => {
  if (state.screen !== 'game') return;
  if (document.hidden) {
    if (state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
  } else {
    state.lastFrameTime = performance.now();
    if (!state.rafId && state.timeLeftMs > 0) state.rafId = requestAnimationFrame(tick);
  }
});

// =========================================================
// INIT + SW
// =========================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register fail:', err));
  });
}

(async function init() {
  await loadLeaderboard();
  renderLeaderboard();
  // arka planda görselleri çek — etkinlikte offline da çalışsın
  loadImages().then(list => { state.images = list; preloadAll(); });
})();
</script>
